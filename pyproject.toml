[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mycli"
version = "0.1.0"
description = "A collection of CLI utilities"
requires-python = ">=3.9"
dependencies = [
    "rich",
    "textual>=0.80",
]

[project.scripts]
deepest-path = "mycli.deepest_path:main"
slurm-monitor = "mycli.slurm_monitor:main"
slurm-notifier = "mycli.slurm_notifier:main"
